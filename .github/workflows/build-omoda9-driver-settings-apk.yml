name: Build Omoda 9 Driver Settings APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/omoda-9-driver-setting-tygm8a
    paths:
      - "omoda9-driver-settings/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: omoda9-driver-settings
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: omoda9-driver-settings-debug-apk
          path: omoda9-driver-settings/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
