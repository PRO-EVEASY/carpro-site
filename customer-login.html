<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>כניסה ללקוחות • ADBAUTHKEY</title><meta name="theme-color" content="#080d1d">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 15% 0,#253d68,transparent 55%),#080d1d;color:#eef6ff;font:16px/1.6 system-ui,Arial,sans-serif}.card{width:min(440px,calc(100% - 32px));padding:34px;border:1px solid #334767;border-radius:24px;background:#111b30;box-shadow:0 24px 80px #0005}.brand{font-size:23px;font-weight:900;letter-spacing:.03em;direction:ltr;text-align:right}.brand span{color:#06cef5}small,p{color:#a9bad2}h1{font-size:28px;margin:20px 0 8px}label{display:block;margin:19px 0 6px;font-size:14px}input{display:block;width:100%;padding:14px;border:1px solid #415675;border-radius:12px;background:#080f20;color:#fff;direction:ltr;font:20px ui-monospace,monospace}input:focus{outline:2px solid #06cef5}button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:12px;background:linear-gradient(100deg,#934dff,#07cff2);color:#061426;font:800 17px system-ui;cursor:pointer}button:disabled{opacity:.5}#message{min-height:26px;font-size:14px;color:#ffcf9b}.foot{font-size:12px;border-top:1px solid #334767;margin-top:20px;padding-top:16px}
body{background:linear-gradient(#04101c88,#04101cdd),url('/assets/images/adbauthkey-cars.png') center/cover fixed}.card{background:#101b30ed;box-shadow:0 24px 80px #0008;backdrop-filter:blur(12px)}</style></head><body><main class="card"><div class="brand">ADB<span>AUTH</span>KEY</div><small>ADB AUTHORIZATION STUDIO</small><h1>כניסה אישית למערכת</h1><p>מזינים את מספר הלקוח ואת הקוד המתחלף מאפליקציית האימות.</p><form id="login"><label for="customer">מספר לקוח</label><input id="customer" name="customerId" placeholder="CP-XXXXXXXX" autocomplete="username" maxlength="24" required><label for="code">קוד אימות בן 6 ספרות</label><input id="code" name="code" placeholder="000000" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button id="submit">כניסה מאובטחת</button><p id="message" role="status"></p></form><p class="foot">הקוד מתחלף כל 30 שניות. להגדרה ראשונית או לאיפוס גישה, פונים ל־ADBAUTHKEY.</p></main>
<script>
const form=document.getElementById('login'),message=document.getElementById('message'),button=document.getElementById('submit');
fetch('/api/status',{credentials:'same-origin',cache:'no-store'}).then(r=>{if(r.ok)location.replace('/')}).catch(()=>{});
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;message.textContent='בודק את הקוד…';try{const response=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-ADBAUTHKEY-Action':'customer-login'},body:JSON.stringify({...Object.fromEntries(new FormData(form)),intent:'customer-login'})});if(!response.ok){const data=await response.json();console.warn('Customer login refused',response.status,data.error);throw new Error(data.error==='login_rate_limited'?'בוצעו ניסיונות רבים. נסו שוב בעוד 10 דקות.':'הפרטים אינם תקינים או שהקוד כבר שומש. המתינו לקוד הבא באפליקציה.')}location.replace('/')}catch(error){message.textContent=error.message||'לא ניתן להתחבר כרגע.'}finally{button.disabled=false}});
</script></body></html>
